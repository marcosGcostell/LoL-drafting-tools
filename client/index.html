<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link
      href="https://fonts.googleapis.com/css?family=Nunito+Sans:400,600,700"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="assets/img/icons/favicon.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./assets/css/index.css" />
    <script defer src="src/router.js" type="module"></script>
    <title>draftKing - League of Legends – Drafting Tool</title>
  </head>

  <body>
    <div class="main-container">
      <!-- HEADER -->
      <header>
        <div class="header header__logo">
          <img
            src="https://res.cloudinary.com/dpj4gmkge/image/upload/v1753397988/logo_o8jvbf.png"
            class="logo"
            alt="draftKing"
          />
        </div>
        <div class="header header__central">
          <div id="language__btn" class="btn btn__clickable">
            <span>EN</span>
          </div>
        </div>
        <!-- Login buttons -->
        <div id="login__btns" class="header header__users">
          <div id="login__btn" class="btn btn__clickable" data-value="login">
            <span>Log In</span>
          </div>
          <div id="signup__btn" class="btn btn__clickable" data-value="signup">
            <span>Sing Up</span>
          </div>
        </div>
        <!-- User section -->
        <div id="user__navbar" class="header header__users hidden">
          <div class="header__username">
            <span>Not logged in</span>
          </div>
          <div
            id="profile__btn"
            class="header user__icon item__clickable"
            data-value="profile"
          >
            <svg class="user__icon">
              <use href="assets/img/icons/icons.svg#icon-user"></use>
            </svg>
          </div>
        </div>
      </header>
      <!-- MAIN -->
      <main id="app-page">
        <!-- APP SECTION -->
      </main>
      <!-- FOOTER -->
      <footer>
        <p>League of Legends - Riot Games</p>
      </footer>
    </div>
  </body>
</html>
