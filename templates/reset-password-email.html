<div style="background-color: #f6f6f6; margin: 0">
  <table
    style="
      font-family: 'akzidenz', 'helvetica', 'arial', sans-serif;
      font-size: 14px;
      color: #001e2b;
      width: 98%;
      margin: 0 auto;
      border: none;
    "
    valign="top"
    cellspacing="0"
    cellpadding="0"
  >
    <tbody>
      <tr>
        <td style="padding-top: 36px; padding-bottom: 22px; padding-left: 32px">
          <img
            width="160"
            height="40"
            src="{%LOGO%}"
            data-imagetype="External"
          />
        </td>
      </tr>
      <tr style="background-color: #ffffff">
        <td>
          <table
            style="
              width: 100%;
              line-height: 20px;
              padding: 32px;
              border: 1px solid;
              border-color: #f0f0f0;
              background-color: #ffffff;
            "
            cellpadding="0"
          >
            <tbody>
              <tr>
                <td style="font-size: 16px">
                  Here is your one-time request code to restore the password:
                </td>
              </tr>
              <tr>
                <td style="padding-top: 24px; font-size: 20px">
                  <span
                    style="font-size: 20px; font-weight: bold"
                    id="x_verification-code"
                    >{%TOKEN%}</span
                  >
                </td>
              </tr>
              <tr>
                <td style="padding-top: 24px; font-size: 16px">
                  This code expires after 5 minutes. If you did not request
                  this, please change your password on draftKing website.
                </td>
              </tr>
            </tbody>
          </table>
        </td>
      </tr>
      <tr>
        <td style="font-size: 12px; padding: 24px 32px; color: #999">
          This message was sent from KuantiK Software
        </td>
      </tr>
    </tbody>
  </table>
</div>
